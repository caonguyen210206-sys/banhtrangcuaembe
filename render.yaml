services:
  - type: web
    name: tutorflow-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: MAX_FILE_MB
        value: 25
      - key: ALLOWED_ORIGINS
        value: https://caonguyen210206-sys.github.io
      - key: OPENAI_API_KEY
        sync: false
