<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cute Banh Trang</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
      color: #5d321f;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 126, 179, 0.28), transparent 28%),
        radial-gradient(circle at 85% 18%, rgba(255, 179, 71, 0.32), transparent 25%),
        radial-gradient(circle at 50% 88%, rgba(98, 195, 112, 0.22), transparent 28%),
        linear-gradient(135deg, #fff7df 0%, #ffe6ef 100%);
      overflow: hidden;
    }
    .sparkles span {
      position: fixed;
      font-size: clamp(18px, 3vw, 34px);
      animation: float 4s ease-in-out infinite;
      opacity: 0.8;
      pointer-events: none;
    }
    .sparkles span:nth-child(1) { top: 10%; left: 12%; animation-delay: 0s; }
    .sparkles span:nth-child(2) { top: 18%; right: 14%; animation-delay: 0.8s; }
    .sparkles span:nth-child(3) { bottom: 18%; left: 18%; animation-delay: 1.4s; }
    .sparkles span:nth-child(4) { bottom: 12%; right: 18%; animation-delay: 2.1s; }
    .card {
      width: min(92vw, 560px);
      padding: 34px 26px 38px;
      border: 5px solid rgba(255, 126, 179, 0.5);
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 24px 60px rgba(107, 62, 38, 0.22);
      text-align: center;
      backdrop-filter: blur(12px);
      position: relative;
    }
    h1 { margin: 0 0 10px; font-size: clamp(32px, 7vw, 58px); line-height: 1; }
    .subtitle { margin: 0 auto 28px; max-width: 420px; font-size: 18px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 18px 30px;
      font: inherit;
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #ff7eb3, #ff5f6d, #ffb347);
      cursor: pointer;
      box-shadow: 0 14px 0 #d65365, 0 24px 35px rgba(107, 62, 38, 0.22);
      transform: translateY(0) rotate(-1deg);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    button:hover { transform: translateY(-4px) rotate(1deg) scale(1.03); filter: saturate(1.15); }
    button:active { transform: translateY(9px) scale(0.98); box-shadow: 0 5px 0 #d65365, 0 12px 18px rgba(107, 62, 38, 0.22); }
    .plate {
      margin: 32px auto 0;
      width: min(84vw, 420px);
      aspect-ratio: 1.22;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 52%, #f3dfc6 53%, #f3dfc6 65%, #fff 66%);
      box-shadow: inset 0 -14px 18px rgba(139, 74, 47, 0.13), 0 20px 30px rgba(107, 62, 38, 0.22);
      position: relative;
      display: none;
      animation: pop 0.65s cubic-bezier(.2, 1.5, .4, 1) forwards;
    }
    .plate.show { display: block; }
    .noodle { position: absolute; height: 18px; border-radius: 999px; background: #ffca63; box-shadow: inset 0 -4px 0 rgba(139, 74, 47, 0.14); transform-origin: center; }
    .n1 { width: 250px; left: 72px; top: 110px; transform: rotate(8deg); }
    .n2 { width: 230px; left: 85px; top: 150px; transform: rotate(-11deg); background: #f5aa47; }
    .n3 { width: 210px; left: 106px; top: 190px; transform: rotate(13deg); }
    .n4 { width: 185px; left: 118px; top: 75px; transform: rotate(-17deg); background: #ffd374; }
    .n5 { width: 165px; left: 132px; top: 224px; transform: rotate(-4deg); background: #f4b24f; }
    .topping { position: absolute; display: grid; place-items: center; border-radius: 50%; font-size: 22px; animation: wiggle 1.8s ease-in-out infinite; }
    .peanut { width: 32px; height: 22px; background: #b8753b; border-radius: 45%; }
    .egg { width: 44px; height: 32px; background: white; box-shadow: inset 0 0 0 10px #ffd65a; }
    .face { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%); font-size: 48px; filter: drop-shadow(0 5px 4px rgba(139, 74, 47, 0.18)); }
    .speech { margin-top: 18px; display: none; font-size: clamp(20px, 4.2vw, 30px); font-weight: 800; color: #e64663; animation: pop 0.45s ease forwards; }
    .speech.show { display: block; }
    .confetti { position: fixed; top: -20px; width: 12px; height: 18px; border-radius: 4px; animation: fall 1.7s linear forwards; pointer-events: none; }
    @keyframes pop { from { opacity: 0; transform: scale(0.35) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0deg); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg) scale(1.08); } }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-18px) rotate(10deg); } }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    @media (max-width: 480px) { .card { padding: 28px 18px 32px; } .n1 { width: 58%; left: 20%; } .n2 { width: 54%; left: 22%; } .n3 { width: 48%; left: 26%; } .n4 { width: 42%; left: 29%; } .n5 { width: 38%; left: 31%; } }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span>✨</span><span>🌶️</span><span>🥢</span><span>💖</span>
  </div>
  <main class="card">
    <h1 id="title"></h1>
    <p id="sub" class="subtitle"></p>
    <button id="eatBtn" type="button"></button>
    <section id="plate" class="plate" aria-label="cute food plate">
      <div class="noodle n1"></div><div class="noodle n2"></div><div class="noodle n3"></div><div class="noodle n4"></div><div class="noodle n5"></div>
      <div class="topping" style="left: 25%; top: 35%; color: #62c370; font-size: 28px;">🌿</div>
      <div class="topping" style="left: 64%; top: 34%; color: #f44336; font-size: 26px;">🌶️</div>
      <div class="topping egg" style="left: 48%; top: 27%;"></div>
      <div class="topping peanut" style="left: 34%; top: 60%;"></div>
      <div class="topping peanut" style="left: 62%; top: 61%;"></div>
      <div class="topping" style="left: 56%; top: 50%; font-size: 30px;">🦐</div>
      <div class="face">😋</div>
    </section>
    <div id="speech" class="speech"></div>
  </main>
  <script>
    const txt = (...codes) => String.fromCharCode(...codes);
    const title = txt(65,110,32,109,105,110,104,32,110,104,97,63) + ' 🥺';
    const sub = txt(77,111,116,32,99,104,105,101,99,32,110,117,116,32,98,101,32,120,105,110,104,32,100,97,110,103,32,99,104,111,32,100,117,111,99,32,98,97,109,46,46,46);
    const btnText = txt(104,227,121,32,259,110,32,116,244,105,32,273,105) + ' 🍽️';
    const speechText = txt(84,97,100,97,97,97,33,32,66,225,110,104,32,116,114,225,110,103,32,116,114,7897,110,32,115,105,234,117,32,99,117,116,101,32,273,226,121) + ' 🥰';
    const doneText = txt(110,103,111,110,32,113,117,225,32,116,114,7901,105,105,105) + ' 😭💖';
    const button = document.querySelector('#eatBtn');
    const plate = document.querySelector('#plate');
    const speech = document.querySelector('#speech');
    document.querySelector('#title').textContent = title;
    document.querySelector('#sub').textContent = sub;
    button.textContent = btnText;
    speech.textContent = speechText;
    const colors = ['#ff7eb3', '#ffb347', '#62c370', '#ff5f6d', '#ffd65a'];
    function throwConfetti() {
      for (let i = 0; i < 42; i += 1) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = `${Math.random() * 0.45}s`;
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(piece);
        piece.addEventListener('animationend', () => piece.remove());
      }
    }
    button.addEventListener('click', () => {
      plate.classList.add('show');
      speech.classList.add('show');
      button.textContent = doneText;
      throwConfetti();
    });
  </script>
</body>
</html>
